name: yalla
description: "Yalla! - 5 seconds party game"
publish_to: "none"
version: 1.0.11+11
environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.1
  game_kit:
    git:
      url: https://github.com/GeeksJo/gameKit_package_flutter.git
      ref: development

  # Host [DEFAULT] Firebase. Remote Config carries the ads kill switch and the
  # force-update / app-moved values; Messaging receives remote campaigns, which
  # work only on the host app and not on the kit's named `game_kit` one.
  firebase_core: ^4.11.0
  firebase_remote_config: ^6.5.3
  firebase_messaging: ^16.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.6

# 13.3.0 calls NSProcessInfo.isiOSAppOnVision directly; that API needs iOS SDK
# 26.1+, which breaks builds on Xcode 26.0.x. 13.2.0 uses runtime dispatch.
dependency_overrides:
  device_info_plus: 13.2.0
  # Play Billing 8+ (in_app_purchase_android 0.5.x). Do not resolve to 0.4.x / 7.x.
  in_app_purchase_android: 0.5.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/content/
    - assets/images/
    - assets/images/categories/
  fonts:
    - family: ElMessiri
      fonts:
        - asset: assets/fonts/El_Messiri/ElMessiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/El_Messiri/ElMessiri-Medium.ttf
          weight: 500
        - asset: assets/fonts/El_Messiri/ElMessiri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/El_Messiri/ElMessiri-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#0D47A1"
  image: assets/images/yalla.png
  android_12:
    color: "#0D47A1"
    image: assets/images/yalla_12.png
