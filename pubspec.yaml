name: yalla
description: "Yalla! - 5 seconds party game"
publish_to: "none"
version: 1.0.9+9
environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  url_launcher: ^6.3.1
  game_kit:
    git:
      url: https://github.com/GeeksJo/gameKit_package_flutter.git
      ref: development

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.6

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/content/
    - assets/images/
    - assets/images/categories/
  fonts:
    - family: ElMessiri
      fonts:
        - asset: assets/fonts/El_Messiri/ElMessiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/El_Messiri/ElMessiri-Medium.ttf
          weight: 500
        - asset: assets/fonts/El_Messiri/ElMessiri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/El_Messiri/ElMessiri-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#0D47A1"
  image: assets/images/yalla.png
  android_12:
    color: "#0D47A1"
    image: assets/images/yalla_12.png
